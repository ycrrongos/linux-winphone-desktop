[package]
edition = "2024"
name = "fluent-egui"
version = "0.1.0"
authors = [
    "Lei tianshuo <leitianshuo1337@gmail.com>",
    "Qiu Qi <rzsgsfm@gmail.com>",
]
build = "build.rs"
include = [
    "/src/**",
    "!/src/assets/FluentSystemIcons-Regular.ttf",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/Cargo.toml",
    "/build.rs",
    "/README.md",
    "/PROJECT_GUIDE.md",
    "/CHANGELOG.md",
    "/README_zh.md",
    "/PROJECT_GUIDE_zh.md",
    "/CHANGELOG_zh.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/AUTHORS",
    "/CONTRIBUTING.md",
    "/CONTRIBUTING_zh.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fluent 2 design system implementation for the egui immediate-mode GUI library. "
homepage = "https://fluent-egui.lastudio.cc"
readme = "README.md"
keywords = [
    "egui",
    "fluent2",
    "gui",
    "theme",
    "widgets",
]
categories = [
    "gui",
    "rendering",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/laststudio/fluent-egui"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
accesskit = ["eframe/accesskit"]
android-game-activity = [
    "glow",
    "eframe/android-game-activity",
    "winit/android-game-activity",
]
android-native-activity = [
    "glow",
    "eframe/android-native-activity",
    "winit/android-native-activity",
]
default = [
    "glow",
    "x11",
    "wayland",
    "accesskit",
]
glow = [
    "eframe/glow",
    "dep:glow",
    "dep:image",
]
ios = ["wgpu"]
wayland = [
    "eframe/wayland",
    "winit/wayland",
]
web = [
    "glow",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
wgpu = [
    "eframe/wgpu_no_default_features",
    "dep:wgpu",
    "dep:image",
]
win7 = []
windows-platform = ["dep:windows"]
x11 = [
    "eframe/x11",
    "winit/x11",
]

[lib]
name = "fluent_egui"
path = "src/lib.rs"

[[example]]
name = "android"
crate-type = ["cdylib"]
path = "examples/android.rs"
test = false

[[example]]
name = "demo"
path = "examples/demo.rs"
test = true

[[example]]
name = "web"
path = "examples/web.rs"

[[test]]
name = "documentation"
path = "tests/documentation.rs"

[[test]]
name = "platform_api"
path = "tests/platform_api.rs"

[dependencies.eframe]
version = "0.35.0"
features = ["default_fonts"]
default-features = false

[dependencies.glow]
version = "0.17.0"
optional = true

[dependencies.image]
version = "0.25.10"
features = ["png"]
optional = true
default-features = false

[dependencies.raw-window-handle]
version = "0.6.2"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.149"

[dependencies.wgpu]
version = "29.0.4"
features = [
    "dx12",
    "metal",
    "vulkan",
]
optional = true
default-features = false

[dependencies.winit]
version = "0.30.13"
features = ["rwh_06"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.114"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4.64"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.91"
features = ["HtmlCanvasElement"]
optional = true

[target."cfg(windows)".dependencies.windows]
version = "0.62.2"
features = [
    "Foundation_Metadata",
    "Media_Capture",
    "Media_Playback",
    "Storage_Pickers",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
]
optional = true

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = true
